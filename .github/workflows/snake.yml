name: Generate snake animation

on:
  schedule: # roda a cada 12 horas (minuto 0, às 00h e 12h UTC)
    - cron: "0 */12 * * *"

  workflow_dispatch: # permite rodar manualmente pela aba Actions

  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: generate snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: hide progress bar
        # O gerador não tem opção para esconder a barra de progresso
        # (os <rect class="u">), então escondemos via CSS e cortamos
        # os 32px de altura que ela ocupava embaixo do gráfico.
        run: |
          python3 - <<'PY'
          import glob, re
          for f in glob.glob("dist/*.svg"):
              s = open(f).read()
              s = s.replace("<style>", "<style>.u{display:none}", 1)
              s = re.sub(r'viewBox="(-?[\d.]+) (-?[\d.]+) ([\d.]+) ([\d.]+)"',
                         lambda m: f'viewBox="{m[1]} {m[2]} {m[3]} {float(m[4]) - 32:g}"', s, count=1)
              s = re.sub(r'(<svg[^>]*?) height="([\d.]+)"',
                         lambda m: f'{m[1]} height="{float(m[2]) - 32:g}"', s, count=1)
              open(f, "w").write(s)
          PY

      - name: push snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
